<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chieru~♪</title>
    <style>
      body {
        text-align: center;
      }
      textarea {
        width: 500px;
        height: 200px;
        resize: none;
        display: block;
        margin: 0 auto;
      }
      button {
        margin: 8px 8px;
      }
    </style>
  </head>
  <body>
    <h1>Chieru~♪</h1>
    <p>The ciphertext ignores all non-Chinese characters, and punctuation marks and line breaks can be added at will.</p>
    <textarea id="sourceArea"></textarea>
    <button id="encryptButton">↓Encrypt</button>
    <label>
      <input type="checkbox" id="randomMark" checked />
      Randomly add punctuation
    </label>
    <button id="decryptButton">↑Decrypt</button>
    <textarea id="targetArea"></textarea>
    <script src="./script.js"></script>
  </body>
</html>
